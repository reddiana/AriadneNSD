<title>M71 머지 소트 NS · 플로차트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 두 칸: 왼쪽 NS 차트(갤러리의 그림 그대로), 오른쪽 같은 알고리즘의 플로차트. 좁으면 위아래 */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1d2330; --muted: #5d6677;
  --line: #2a3142; --shape: #ffffff; --decision: #fff6e0; --call: #eaf2ff;
  --term: #e9f6ee; --loop: #c2410c; --ok: #15803d; --no: #b91c1c;
  --mono: "D2Coding", Consolas, "Malgun Gothic", monospace;
  --sans: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --panel: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b2;
  --line: #c9d0dc; --shape: #1f2430; --decision: #3a3120; --call: #1e2c44;
  --term: #1c3326; --loop: #fb923c; --ok: #4ade80; --no: #f87171; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b2;
  --line: #c9d0dc; --shape: #1f2430; --decision: #3a3120; --call: #1e2c44;
  --term: #1c3326; --loop: #fb923c; --ok: #4ade80; --no: #f87171; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px; }
main { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 70ch; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
figure { margin: 0; background: var(--panel); border: 1px solid color-mix(in srgb, var(--line) 18%, transparent);
  border-radius: 8px; padding: 16px; min-width: 0; display: grid; gap: 10px; }
figcaption { font-weight: 600; }
figcaption span { font-weight: 400; color: var(--muted); font-size: .9rem; margin-left: .4em; }
.scroll { overflow-x: auto; }
.ns { background: #fff; border-radius: 4px; padding: 8px; width: fit-content; }
.ns svg, .fc svg { display: block; max-width: none; }
.fc text { font-family: var(--mono); font-size: 13px; fill: var(--fg); }
.fc .lbl { font-family: var(--sans); font-size: 12px; font-weight: 600; }
.fc .yes { fill: var(--ok); } .fc .no { fill: var(--no); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--line) 15%, transparent); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
code { font-family: var(--mono); font-size: .9em; }
</style>

<main>
  <h1>M71 머지 소트: NS 차트와 플로차트</h1>
  <p class="lead">앱 예제의 <code>merge_sort(a, lo, hi)</code>를 두 방식으로 그렸습니다. 왼쪽은 알고리즘 갤러리의 그림 그대로, 오른쪽은 같은 순서의 플로차트(ISO 5807 기호)입니다. 반복의 되돌아가는 선은 주황색으로 칠했습니다.</p>

  <div class="pair">
    <figure>
      <figcaption>NS 차트 <span>AriadneNSD, 블록 15개</span></figcaption>
      <div class="scroll"><div class="ns">%%NS_SVG%%</div></div>
    </figure>

    <figure class="fc">
      <figcaption>플로차트 <span>도형 14개, 화살표 14개</span></figcaption>
      <div class="scroll">
      <svg width="470" height="900" viewBox="0 0 470 900" role="img" aria-label="머지 소트 플로차트">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" style="fill:var(--line)"/></marker>
          <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" style="fill:var(--loop)"/></marker>
        </defs>
        <g transform="translate(20,0)" style="stroke:var(--line);stroke-width:1.4">
          <!-- 시작 -->
          <rect x="110" y="16" width="220" height="36" rx="18" style="fill:var(--term)"/>
          <!-- 판단: 길이 < 2 -->
          <polygon points="220,78 310,110 220,142 130,110" style="fill:var(--decision)"/>
          <rect x="360" y="92" width="80" height="36" rx="18" style="fill:var(--term)"/>
          <!-- mid -->
          <rect x="110" y="170" width="220" height="36" style="fill:var(--shape)"/>
          <!-- 두 번의 재귀 호출(미리 정의된 처리) -->
          <rect x="110" y="230" width="220" height="36" style="fill:var(--call)"/>
          <line x1="122" y1="230" x2="122" y2="266"/><line x1="318" y1="230" x2="318" y2="266"/>
          <rect x="110" y="290" width="220" height="36" style="fill:var(--call)"/>
          <line x1="122" y1="290" x2="122" y2="326"/><line x1="318" y1="290" x2="318" y2="326"/>
          <!-- 초기화 -->
          <rect x="110" y="350" width="220" height="36" style="fill:var(--shape)"/>
          <!-- 반복 조건 -->
          <polygon points="220,418 335,454 220,490 105,454" style="fill:var(--decision)"/>
          <!-- 비교 -->
          <polygon points="220,520 300,552 220,584 140,552" style="fill:var(--decision)"/>
          <rect x="25" y="604" width="150" height="48" style="fill:var(--shape)"/>
          <rect x="265" y="604" width="150" height="48" style="fill:var(--shape)"/>
          <!-- 남은 것 붙이기, 되쓰기, 끝 -->
          <rect x="110" y="720" width="220" height="36" style="fill:var(--shape)"/>
          <rect x="110" y="780" width="220" height="36" style="fill:var(--shape)"/>
          <rect x="160" y="840" width="120" height="36" rx="18" style="fill:var(--term)"/>

          <g style="fill:none">
            <line x1="220" y1="52" x2="220" y2="78" marker-end="url(#ah)"/>
            <line x1="310" y1="110" x2="360" y2="110" marker-end="url(#ah)"/>
            <line x1="220" y1="142" x2="220" y2="170" marker-end="url(#ah)"/>
            <line x1="220" y1="206" x2="220" y2="230" marker-end="url(#ah)"/>
            <line x1="220" y1="266" x2="220" y2="290" marker-end="url(#ah)"/>
            <line x1="220" y1="326" x2="220" y2="350" marker-end="url(#ah)"/>
            <line x1="220" y1="386" x2="220" y2="418" marker-end="url(#ah)"/>
            <line x1="220" y1="490" x2="220" y2="520" marker-end="url(#ah)"/>
            <polyline points="140,552 100,552 100,604" marker-end="url(#ah)"/>
            <polyline points="300,552 340,552 340,604" marker-end="url(#ah)"/>
            <!-- 반복 거짓: 오른쪽으로 빠져 아래로 -->
            <polyline points="335,454 440,454 440,698 220,698 220,720" marker-end="url(#ah)"/>
            <line x1="220" y1="756" x2="220" y2="780" marker-end="url(#ah)"/>
            <line x1="220" y1="816" x2="220" y2="840" marker-end="url(#ah)"/>
          </g>
          <!-- 되돌아가는 선 -->
          <g style="fill:none;stroke:var(--loop);stroke-width:1.8">
            <line x1="100" y1="652" x2="100" y2="672"/>
            <polyline points="340,652 340,672 0,672 0,402 220,402" marker-end="url(#ahl)"/>
          </g>
          <circle cx="100" cy="672" r="3" style="fill:var(--loop);stroke:none"/>
          <circle cx="220" cy="402" r="3" style="fill:var(--loop);stroke:none"/>

          <g style="stroke:none" text-anchor="middle" dominant-baseline="central">
            <text x="220" y="34">merge_sort(a, lo, hi)</text>
            <text x="220" y="110">hi - lo &lt; 2</text>
            <text x="400" y="110">return</text>
            <text x="220" y="188">mid = (lo + hi) &gt;&gt; 1</text>
            <text x="220" y="248">merge_sort(a, lo, mid)</text>
            <text x="220" y="308">merge_sort(a, mid, hi)</text>
            <text x="220" y="368">i, j, tmp = lo, mid, []</text>
            <text x="220" y="454">i &lt; mid and j &lt; hi</text>
            <text x="220" y="552">a[i] &lt;= a[j]</text>
            <text x="100" y="619">tmp.append(a[i])</text>
            <text x="100" y="637">i += 1</text>
            <text x="340" y="619">tmp.append(a[j])</text>
            <text x="340" y="637">j += 1</text>
            <text x="220" y="738">tmp += a[i:mid] + a[j:hi]</text>
            <text x="220" y="798">a[lo:hi] = tmp</text>
            <text x="220" y="858">끝</text>
            <text class="lbl yes" x="334" y="100">참</text>
            <text class="lbl no" x="236" y="158">거짓</text>
            <text class="lbl yes" x="232" y="505">참</text>
            <text class="lbl no" x="372" y="444">거짓</text>
            <text class="lbl yes" x="118" y="542">참</text>
            <text class="lbl no" x="324" y="542">거짓</text>
          </g>
        </g>
      </svg>
      </div>
    </figure>
  </div>

  <figure>
    <figcaption>나란히 보며 볼 곳</figcaption>
    <div class="scroll"><table>
      <thead><tr><th>무엇</th><th>NS 차트</th><th>플로차트</th></tr></thead>
      <tbody>
        <tr><td>반복</td><td>while 블록이 몸통을 감싸 범위가 모양으로 보임</td><td>판단 도형 + 되돌아가는 선. 어디까지가 몸통인지는 선을 따라가야 앎</td></tr>
        <tr><td>조기 반환</td><td>if의 참 갈래에 return, 거짓 갈래는 빈 블록</td><td>판단에서 옆으로 빠지는 끝 도형</td></tr>
        <tr><td>재귀 호출</td><td>호출 블록 두 개(같은 Method를 가리킴)</td><td>미리 정의된 처리 기호(양옆 두 줄) 두 개</td></tr>
        <tr><td>읽는 방향</td><td>위에서 아래로만</td><td>아래로 가다가 반복 거짓은 오른쪽 바깥, 되돌아가는 선은 왼쪽 바깥으로 돎</td></tr>
        <tr><td>차지하는 자리</td><td>318 × 504</td><td>470 × 900 (선을 돌릴 여백 포함)</td></tr>
      </tbody>
    </table></div>
  </figure>
</main>
