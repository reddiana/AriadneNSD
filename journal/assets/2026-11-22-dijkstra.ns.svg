<text x="24" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">dijkstra(G, s)</tspan></text>
<path d="M24 64 L291 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
