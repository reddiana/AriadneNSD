<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="315" height="552" viewBox="0 0 315 552">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="7a6d3a99f666b143b8c4635096f60addf572f1c65eeee03f8e200f08912f7080"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "dijkstra(G, s)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "for",
          "text": "for each v in G.V",
          "body": [
            {
              "id": "b2",
              "kind": "process",
              "text": "dist[v] = ∞"
            },
            {
              "id": "b3",
              "kind": "process",
              "text": "prev[v] = none"
            }
          ]
        },
        {
          "id": "b4",
          "kind": "process",
          "text": "dist[s] = 0"
        },
        {
          "id": "b5",
          "kind": "process",
          "text": "Q = 우선순위 큐(G.V, 키 dist)"
        },
        {
          "id": "b6",
          "kind": "while",
          "text": "Q가 비어 있지 않음",
          "body": [
            {
              "id": "b7",
              "kind": "call",
              "target": {
                "kind": "named",
                "name": "Q.extractMin"
              },
              "args": "",
              "result": "u"
            },
            {
              "id": "b8",
              "kind": "for",
              "text": "for each (v, w) in G.adj[u]",
              "body": [
                {
                  "id": "b9",
                  "kind": "process",
                  "text": "alt = dist[u] + w"
                },
                {
                  "id": "b10",
                  "kind": "if",
                  "text": "alt < dist[v]",
                  "yes": {
                    "id": "r1",
                    "body": [
                      {
                        "id": "b11",
                        "kind": "process",
                        "text": "dist[v] = alt"
                      },
                      {
                        "id": "b12",
                        "kind": "process",
                        "text": "prev[v] = u"
                      },
                      {
                        "id": "b13",
                        "kind": "call",
                        "target": {
                          "kind": "named",
                          "name": "Q.decreaseKey"
                        },
                        "args": "v, alt",
                        "result": ""
                      }
                    ]
                  },
                  "no": {
                    "id": "r2",
                    "body": [
                      {
                        "id": "b14",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b15",
          "kind": "process",
          "text": "return dist, prev"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
