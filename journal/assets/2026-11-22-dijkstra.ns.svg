<text x="78" y="452" font-size="13" fill="#151a22" xml:space="preserve">prev[v] = u</text>
<rect x="68" y="464" width="171" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M75 464 L75 496" fill="none" stroke="#5b77ad" stroke-width="1"/>
