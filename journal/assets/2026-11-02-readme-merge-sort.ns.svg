  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "merge_sort(a, lo, hi)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "if",
          "text": "hi - lo < 2",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b2",
                "kind": "process",
                "text": "return"
              }
            ]
          },
          "no": {
            "id": "r2",
            "body": [
              {
                "id": "b3",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b4",
          "kind": "process",
          "text": "mid = (lo + hi) >> 1"
        },
        {
          "id": "b5",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d1"
          },
          "args": "a, lo, mid",
          "result": ""
        },
        {
          "id": "b6",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d1"
          },
          "args": "a, mid, hi",
          "result": ""
        },
        {
          "id": "b7",
          "kind": "process",
          "text": "i, j, tmp = lo, mid, []"
        },
        {
          "id": "b8",
          "kind": "while",
          "text": "i < mid and j < hi",
          "body": [
            {
              "id": "b9",
              "kind": "if",
              "text": "a[i] <= a[j]",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b10",
                    "kind": "process",
                    "text": "tmp.append(a[i])"
                  },
                  {
                    "id": "b11",
                    "kind": "process",
                    "text": "i += 1"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b12",
                    "kind": "process",
                    "text": "tmp.append(a[j])"
                  },
                  {
                    "id": "b13",
                    "kind": "process",
                    "text": "j += 1"
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b14",
          "kind": "process",
          "text": "tmp += a[i:mid] + a[j:hi]"
        },
        {
          "id": "b15",
          "kind": "process",
          "text": "a[lo:hi] = tmp"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
