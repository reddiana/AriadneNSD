      "id": "d1",
      "head": {
        "kind": "method",
        "text": "fib(n)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "if",
          "text": "n < 2",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b2",
                "kind": "process",
                "text": "return n"
              }
            ]
          },
          "no": {
            "id": "r2",
            "body": [
              {
                "id": "b3",
                "kind": "process",
                "text": "a = 0\nb = 1"
              },
              {
                "id": "b4",
                "kind": "for",
                "text": "for i = 2 to n",
                "body": [
                  {
                    "id": "b5",
                    "kind": "process",
                    "text": "t = a + b\na = b\nb = t"
                  }
                ]
              },
              {
                "id": "b6",
                "kind": "process",
                "text": "return b"
              }
            ]
          }
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "fibRec(n)"
      },
      "body": [
        {
          "id": "b7",
          "kind": "if",
          "text": "n < 2",
          "yes": {
            "id": "r3",
            "body": [
              {
                "id": "b8",
                "kind": "process",
                "text": "return n"
              }
            ]
          },
          "no": {
            "id": "r4",
            "body": [
              {
                "id": "b9",
                "kind": "call",
                "target": {
                  "kind": "local",
                  "diagram": "d2"
                },
                "args": "n - 1",
                "result": "a"
              },
              {
                "id": "b10",
                "kind": "call",
                "target": {
                  "kind": "local",
                  "diagram": "d2"
                },
                "args": "n - 2",
                "result": "b"
              },
              {
                "id": "b11",
                "kind": "process",
                "text": "return a + b"
              }
            ]
          }
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
