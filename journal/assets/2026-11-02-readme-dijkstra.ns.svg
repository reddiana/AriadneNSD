<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="333" height="536" viewBox="0 0 333 536">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "dijkstra(graph, s)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "dist = {v: INF for v in graph}"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "dist[s] = 0"
        },
        {
          "id": "b3",
          "kind": "process",
          "text": "pq = [(0, s)]"
        },
        {
          "id": "b4",
          "kind": "while",
          "text": "pq",
          "body": [
            {
              "id": "b5",
              "kind": "process",
              "text": "d, u = heappop(pq)"
            },
            {
              "id": "b6",
              "kind": "if",
              "text": "d > dist[u]",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b7",
                    "kind": "process",
                    "text": "continue"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b8",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b9",
              "kind": "for",
              "text": "for v, w in graph[u]",
              "body": [
                {
                  "id": "b10",
                  "kind": "if",
                  "text": "dist[u] + w < dist[v]",
                  "yes": {
                    "id": "r3",
                    "body": [
                      {
                        "id": "b11",
                        "kind": "process",
                        "text": "dist[v] = dist[u] + w"
                      },
                      {
                        "id": "b12",
                        "kind": "process",
                        "text": "prev[v] = u"
                      },
                      {
                        "id": "b13",
                        "kind": "process",
                        "text": "heappush(pq, (dist[v], v))"
                      }
                    ]
                  },
                  "no": {
                    "id": "r4",
                    "body": [
                      {
                        "id": "b14",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b15",
          "kind": "process",
          "text": "return dist, prev"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
