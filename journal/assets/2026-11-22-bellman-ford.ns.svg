  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="5a0d01b348f1ba0816f42850b31155ba6b95dac80c3ffedf05f54cfaca6524ed"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "bellmanFord(G, s)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "for",
          "text": "for each v in G.V",
          "body": [
            {
              "id": "b2",
              "kind": "process",
              "text": "dist[v] = ∞"
            },
            {
              "id": "b3",
              "kind": "process",
              "text": "prev[v] = none"
            }
          ]
        },
        {
          "id": "b4",
          "kind": "process",
          "text": "dist[s] = 0"
        },
        {
          "id": "b5",
          "kind": "for",
          "text": "for i = 1 to |G.V| - 1",
          "body": [
            {
              "id": "b6",
              "kind": "for",
              "text": "for each (u, v, w) in G.E",
              "body": [
                {
                  "id": "b7",
                  "kind": "if",
                  "text": "dist[u] + w < dist[v]",
                  "yes": {
                    "id": "r1",
                    "body": [
                      {
                        "id": "b8",
                        "kind": "process",
                        "text": "dist[v] = dist[u] + w"
                      },
                      {
                        "id": "b9",
                        "kind": "process",
                        "text": "prev[v] = u"
                      }
                    ]
                  },
                  "no": {
                    "id": "r2",
                    "body": [
                      {
                        "id": "b10",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b11",
          "kind": "for",
          "text": "for each (u, v, w) in G.E",
          "body": [
            {
              "id": "b12",
              "kind": "if",
              "text": "dist[u] + w < dist[v]",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b13",
                    "kind": "process",
                    "text": "error \"음의 사이클이 있음\""
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b14",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b15",
          "kind": "process",
          "text": "return dist, prev"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
