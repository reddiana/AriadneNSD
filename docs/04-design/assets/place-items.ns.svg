<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="529" height="558" viewBox="0 0 529 558">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="742dc5ee989b62d86e08661368fb3da3d09ae697b07c26ac52da8e5dd0b51510"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "javascript",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "placeItems(items, box)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "needed = 0"
        },
        {
          "id": "b3",
          "kind": "for",
          "text": "for (const item of items)",
          "body": [
            {
              "id": "b2",
              "kind": "process",
              "text": "needed += itemHeight(item)"
            }
          ]
        },
        {
          "id": "b4",
          "kind": "process",
          "text": "each = floor(max(0, box.height - needed)\n             / count)"
        },
        {
          "id": "b5",
          "kind": "process",
          "text": "y = box.y"
        },
        {
          "id": "b14",
          "kind": "for",
          "text": "for (const item of items)",
          "body": [
            {
              "id": "b8",
              "kind": "if",
              "text": "item is last",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b6",
                    "kind": "process",
                    "text": "height = box.y\n  + box.height - y"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b7",
                    "kind": "process",
                    "text": "height = itemHeight(item)\n  + each"
                  }
                ]
              }
            },
            {
              "id": "b9",
              "kind": "process",
              "text": "itemBox = { x: box.x, y,\n  width: box.width, height }"
            },
            {
              "id": "b12",
              "kind": "if",
              "text": "item.kind === 'block'",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b10",
                    "kind": "call",
                    "target": {
                      "kind": "named",
                      "name": "placeBlock"
                    },
                    "args": "item.block, itemBox",
                    "result": ""
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b11",
                    "kind": "call",
                    "target": {
                      "kind": "named",
                      "name": "placeFold"
                    },
                    "args": "item.fold, itemBox",
                    "result": ""
                  }
                ]
              }
            },
            {
              "id": "b13",
              "kind": "process",
              "text": "y += height"
            }
          ]
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
