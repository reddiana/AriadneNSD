  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="0b874b32182f8ca649d7a74a2be67be00973e5c6eb257844c1047c9327b535ca"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "javascript",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "extendTo(index, selection, to)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "from = selection?.kind === 'blocks' ? selection.anchor : null"
        },
        {
          "id": "b2",
          "kind": "if",
          "text": "from === null\n|| !index.blocks.has(from)",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b3",
                "kind": "exit",
                "text": "return selectBlock(index, to)"
              }
            ]
          },
          "no": {
            "id": "r2",
            "body": [
              {
                "id": "b4",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b5",
          "kind": "if",
          "text": "placeOf(index, from).diagram\n!== placeOf(index, to).diagram",
          "yes": {
            "id": "r3",
            "body": [
              {
                "id": "b6",
                "kind": "exit",
                "text": "return selectBlock(index, to)"
              }
            ]
          },
          "no": {
            "id": "r4",
            "body": [
              {
                "id": "b7",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b8",
          "kind": "process",
          "text": "toAncestors = ancestorsOf(index, to)"
        },
        {
          "id": "b9",
          "kind": "for",
          "text": "for (const a of ancestorsOf(index, from))",
          "body": [
            {
              "id": "b10",
              "kind": "process",
              "text": "owner = placeOf(index, a).owner"
            },
            {
              "id": "b11",
              "kind": "process",
              "text": "b = toAncestors.find((id) => placeOf(index, id).owner === owner)"
            },
            {
              "id": "b12",
              "kind": "if",
              "text": "b !== undefined",
              "yes": {
                "id": "r5",
                "body": [
                  {
                    "id": "b13",
                    "kind": "exit",
                    "text": "return selectRange(index, a, b)"
                  }
                ]
              },
              "no": {
                "id": "r6",
                "body": [
                  {
                    "id": "b14",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b15",
          "kind": "process",
          "text": "return selectBlock(index, to)"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
