<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="416" height="514" viewBox="0 0 416 514">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="fcd5013aa3579a06d3e8a1fa14f7d70af54dd897e7b858b3ba557bb142925b77"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "javascript",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "layout(doc)"
      },
      "body": [
        {
          "id": "b2",
          "kind": "for",
          "text": "for (const diagram of doc.content.diagrams)",
          "body": [
            {
              "id": "b1",
              "kind": "call",
              "target": {
                "kind": "named",
                "name": "measureDiagram"
              },
              "args": "diagram, headStyle",
              "result": "measures[i]"
            }
          ]
        },
        {
          "id": "b3",
          "kind": "call",
          "target": {
            "kind": "named",
            "name": "arrange"
          },
          "args": "measures",
          "result": "arrangement"
        },
        {
          "id": "b10",
          "kind": "for",
          "text": "for (const { measure, x, y }\n     of arrangement.placed)",
          "body": [
            {
              "id": "b4",
              "kind": "process",
              "text": "box = { x: paper + x, y: paper + y,\n        width,\n        height: headHeight + bodyHeight }"
            },
            {
              "id": "b6",
              "kind": "if",
              "text": "diagram.head !== null",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b5",
                    "kind": "process",
                    "text": "nodes.push(diagramHead)"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b7",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b8",
              "kind": "process",
              "text": "body = { x: box.x, y: box.y + headHeight,\n         width, height: bodyHeight }"
            },
            {
              "id": "b9",
              "kind": "call",
              "target": {
                "kind": "named",
                "name": "placeSeq"
              },
              "args": "diagram.body, body",
              "result": ""
            }
          ]
        },
        {
          "id": "b11",
          "kind": "process",
          "text": "return { width, height, diagrams,\n         boxes, regions, nodes }"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
