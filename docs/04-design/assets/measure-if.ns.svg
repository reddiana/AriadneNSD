  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="322bf6a78b16f5e5fa2e53fa9e52d8c91ff59e1f21f96ece8387b769b0694269"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "javascript",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "measureIf(block)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "text = measureText(block.text)"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "headHeight = text.height + 2·padY\n  + geometry['size.if-label']"
        },
        {
          "id": "b3",
          "kind": "process",
          "text": "headWidth = text.width + 2·padX\n  + geometry['size.if-head-extra']"
        },
        {
          "id": "b4",
          "kind": "call",
          "target": {
            "kind": "named",
            "name": "measureBody"
          },
          "args": "block.yes.body",
          "result": "yes"
        },
        {
          "id": "b5",
          "kind": "call",
          "target": {
            "kind": "named",
            "name": "measureBody"
          },
          "args": "block.no.body",
          "result": "no"
        },
        {
          "id": "b6",
          "kind": "process",
          "text": "branchWidths = [\n  columnWidth(yes.width, '참'),\n  columnWidth(no.width, '거짓') ]"
        },
        {
          "id": "b7",
          "kind": "process",
          "text": "width = max(headWidth,\n  branchWidths[0] + branchWidths[1])"
        },
        {
          "id": "b8",
          "kind": "process",
          "text": "height = headHeight\n  + max(yes.height, no.height)"
        },
        {
          "id": "b9",
          "kind": "process",
          "text": "return { width, height,\n         headHeight, branchWidths }"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
