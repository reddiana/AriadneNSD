  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="13137b24d29d15a50c04314470a31d259a1bcf63fedd6da4da1c63b3a6e1a3d2"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "javascript",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "measureBlock(block)"
      },
      "body": [
        {
          "id": "b7",
          "kind": "case",
          "text": "block.kind",
          "arms": [
            {
              "id": "r1",
              "label": "'process'",
              "body": [
                {
                  "id": "b1",
                  "kind": "process",
                  "text": "text = measureText(\n  block.text)"
                },
                {
                  "id": "b2",
                  "kind": "process",
                  "text": "m = { width: max(\n    blockMinWidth,\n    text.width + 2·padX),\n  height: text.height\n    + 2·padY }"
                }
              ]
            },
            {
              "id": "r2",
              "label": "'exit'",
              "body": [
                {
                  "id": "b3",
                  "kind": "process",
                  "text": "text = measureText(\n  block.text)"
                },
                {
                  "id": "b4",
                  "kind": "process",
                  "text": "m = { width: max(\n    blockMinWidth,\n    exitWedge\n    + text.width + 2·padX),\n  height: text.height\n    + 2·padY }"
                }
              ]
            },
            {
              "id": "r3",
              "label": "'if'",
              "body": [
                {
                  "id": "b5",
                  "kind": "call",
                  "target": {
                    "kind": "named",
                    "name": "measureIf"
                  },
                  "args": "block",
                  "result": "m"
                }
              ]
            }
          ],
          "otherwise": {
            "id": "r4",
            "body": [
              {
                "id": "b6",
                "kind": "process",
                "text": "m = measureCall\n  · measureLoop\n  · measureEndless\n  · measureParallel\n  · measureCase\n  (block)"
              }
            ]
          }
        },
        {
          "id": "b8",
          "kind": "process",
          "text": "measures.set(block.id, m)"
        },
        {
          "id": "b9",
          "kind": "process",
          "text": "return m"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
