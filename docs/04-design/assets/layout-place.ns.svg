  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="9a3ff5fb03149a7426c6fd925499f21041c235936fb300c5aaf8061cc8552e37"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "javascript",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "placeItems(items, box)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "needed = 0"
        },
        {
          "id": "b3",
          "kind": "for",
          "text": "for (const item of items)",
          "body": [
            {
              "id": "b2",
              "kind": "process",
              "text": "needed += itemHeight(item)"
            }
          ]
        },
        {
          "id": "b4",
          "kind": "process",
          "text": "each = floor(max(0, box.height - needed) / count)"
        },
        {
          "id": "b5",
          "kind": "process",
          "text": "y = box.y"
        },
        {
          "id": "b14",
          "kind": "for",
          "text": "for (const item of items)",
          "body": [
            {
              "id": "b8",
              "kind": "if",
              "text": "item is last",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b6",
                    "kind": "process",
                    "text": "height = box.y + box.height - y"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b7",
                    "kind": "process",
                    "text": "height = itemHeight(item) + each"
                  }
                ]
              }
            },
            {
              "id": "b9",
              "kind": "process",
              "text": "itemBox = { x: box.x, y, width: box.width, height }"
            },
            {
              "id": "b12",
              "kind": "if",
              "text": "item.kind === 'block'",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b10",
                    "kind": "call",
                    "target": {
                      "kind": "named",
                      "name": "placeBlock"
                    },
                    "args": "item.block, itemBox",
                    "result": ""
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b11",
                    "kind": "call",
                    "target": {
                      "kind": "named",
                      "name": "placeFold"
                    },
                    "args": "item.fold, itemBox",
                    "result": ""
                  }
                ]
              }
            },
            {
              "id": "b13",
              "kind": "process",
              "text": "y += height"
            }
          ]
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "splitWidth(total, minimums)"
      },
      "body": [
        {
          "id": "b15",
          "kind": "process",
          "text": "extra = total - sum(minimums)"
        },
        {
          "id": "b16",
          "kind": "process",
          "text": "used = 0"
        },
        {
          "id": "b22",
          "kind": "for",
          "text": "for (const minimum of minimums)",
          "body": [
            {
              "id": "b19",
              "kind": "if",
              "text": "minimum is last",
              "yes": {
                "id": "r5",
                "body": [
                  {
                    "id": "b17",
                    "kind": "process",
                    "text": "width = total - used"
                  }
                ]
              },
              "no": {
                "id": "r6",
                "body": [
                  {
                    "id": "b18",
                    "kind": "process",
                    "text": "width = round(minimum + extra · minimum / sum(minimums))"
                  }
                ]
              }
            },
            {
              "id": "b20",
              "kind": "process",
              "text": "widths.push(width)"
            },
            {
              "id": "b21",
              "kind": "process",
              "text": "used += width"
            }
          ]
        },
        {
          "id": "b23",
          "kind": "process",
          "text": "return widths"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
