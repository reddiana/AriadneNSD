  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="feccec46fe6c98659864ecdbc83899b4654a1503efafa342ea17e94d8f8263d0"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "javascript",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "splitWidth(total, minimums)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "extra = total - sum(minimums)"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "used = 0"
        },
        {
          "id": "b8",
          "kind": "for",
          "text": "for (const minimum of minimums)",
          "body": [
            {
              "id": "b5",
              "kind": "if",
              "text": "minimum is last",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b3",
                    "kind": "process",
                    "text": "width = total - used"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b4",
                    "kind": "process",
                    "text": "width = round(minimum\n  + extra · minimum\n    / sum(minimums))"
                  }
                ]
              }
            },
            {
              "id": "b6",
              "kind": "process",
              "text": "widths.push(width)"
            },
            {
              "id": "b7",
              "kind": "process",
              "text": "used += width"
            }
          ]
        },
        {
          "id": "b9",
          "kind": "process",
          "text": "return widths"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
