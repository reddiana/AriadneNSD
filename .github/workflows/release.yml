# GitHub Release에 Claude skill의 zip을 붙인다 → docs/04-design/07-claude-skill.md 6장
#
# claude.ai의 사용자는 Release에서 ariadne-nsd.zip을 받아 Settings › Capabilities › Skills에 올린다.
# Release를 펴내면(published, 프리릴리스 포함) 그 태그의 코드로 스킬을 빌드하고(pnpm --filter @ariadne-nsd/skill build)
# dist/ariadne-nsd.zip을 그 Release의 파일(asset)로 올린다. 같은 이름의 파일이 있으면 바꾼다.
# 이미 펴낸 Release에 다시 붙이려면 Actions › Release › Run workflow에 태그(v0.4.0)를 적는다.
# Claude Code의 플러그인 마켓플레이스(.claude-plugin/marketplace.json)는 저장소 자체라 이 워크플로와 상관없다.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'zip을 붙일 Release의 태그 (예: v0.4.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: src

jobs:
  skill-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # pnpm의 버전은 src/package.json의 packageManager에서 읽는다
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 태그 v0.4.0이면 플러그인의 버전도 0.4.0이어야 한다(마켓플레이스와 zip이 같은 판을 낸다)
      - name: 태그와 플러그인의 버전이 같은가
        run: |
          version=$(node -p "require('./skills/ariadne-nsd/plugin/.claude-plugin/plugin.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::태그 $TAG와 plugin.json의 버전 $version이 다르다"
            exit 1
          fi

      # 저장소에 넣어 둔 nsd.mjs가 소스의 빌드와 같은지는 CI의 pnpm check(T-1472)가 검사한다.
      # 글꼴 · wasm을 압축한 바이트는 Node의 판마다 다를 수 있어 여기서 git diff로 비교하지 않는다
      - name: 스킬 빌드
        run: pnpm --filter @ariadne-nsd/skill build

      - name: Release에 zip 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" skills/ariadne-nsd/dist/ariadne-nsd.zip --clobber
