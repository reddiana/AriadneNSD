# 설계 문서를 GitHub Pages로 펴낸다 → atelier/decisions/dr-0013-publish-docs-github-pages.md
#
# 사이트: https://reddiana.github.io/AriadneNSD/
#   /            첫 화면 (저장소의 README.md)
#   /docs/…      설계 문서 (docs/)
#   /atelier/…   작업 공간 (atelier/)
#   /til/…       Today I Learned (til/)
#   /app/        웹 버전 앱 (나중에)
#   /manual/     사용자 매뉴얼 (나중에)
#
# GitHub Pages는 저장소 하나에 사이트 하나다. 그래서 앱과 매뉴얼이 생기면 따로 올리지 않고
# 이 워크플로가 모두 빌드해 _site/ 한 폴더로 모은 뒤 한 번에 올린다.
# 같은 빌드를 로컬에서 해 보려면: bash site/build.sh --serve

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 일은 한 번에 하나만. 진행 중인 배포는 끊지 않는다
concurrency:
  group: pages
  cancel-in-progress: false

env:
  QUARTZ_TAG: v4.5.2 # site/build.sh의 QUARTZ_TAG와 같게 둔다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 설계 문서 (Quartz) ──────────────────────────────
      - name: Quartz 받기
        run: git clone --quiet --depth 1 --branch "$QUARTZ_TAG" https://github.com/jackyzha0/quartz.git .quartz

      - name: Quartz 패키지 설치
        working-directory: .quartz
        run: npm ci --no-audit --no-fund

      - name: 설정과 문서 옮기기
        run: |
          node site/patch-quartz.mjs .quartz
          cp site/quartz.config.ts site/quartz.layout.ts .quartz/
          cp site/custom.scss .quartz/quartz/styles/custom.scss
          cp site/icon.png .quartz/quartz/static/icon.png
          node site/prepare-content.mjs . .quartz/content

      - name: 설계 문서 빌드
        working-directory: .quartz
        run: npx quartz build

      - name: 사이트 모으기
        run: |
          mkdir -p _site
          cp -r .quartz/public/. _site/

      # ── 웹 버전 앱 (나중에) ─────────────────────────────
      # 앱 코드가 생기면 여기서 빌드해 _site/app/에 넣는다. 예:
      # - name: 웹 앱 빌드
      #   run: |
      #     npm ci && npm run build --workspace web
      #     mkdir -p _site/app && cp -r packages/web/dist/. _site/app/

      # ── 사용자 매뉴얼 (나중에) ──────────────────────────
      # 매뉴얼이 생기면 여기서 빌드해 _site/manual/에 넣는다.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
