# 코드(src/)를 검사한다 → docs/04-design/07-testing.md 4장, docs/07-coding-guide 1장
#
# pnpm check: 타입 검사 → 린트 → 포맷 확인 → 의존 방향 → 단위 테스트(골든 파일 포함)
# 그다음 웹 앱을 빌드해 첫 내려받기의 번들 사이즈 체크(bundle size budget)를 하고(apps/web/scripts/check-size.mjs),
# Chromium으로 E2E를 실행한다(apps/web/e2e/).
# coverage job은 check와 나란히 돈다: 단위 테스트와 E2E를 커버리지와 함께 돌려 줄마다 합치고,
# 패키지마다 합친 줄 커버리지가 하한(90%)보다 낮거나 테스트가 실패하면 실패한다
# (pnpm coverage:check, scripts/coverage.mjs → docs/04-design/07-testing.md 6장).
# co-change job은 push · Pull Request의 커밋 범위에서 함께 바뀌어야 하는 곳의 짝(scripts/co-change.json)을
# 검사한다. 한쪽만 바뀌었으면 경고만 하고 실패로 하지 않는다(→ docs/07-coding-guide 13.1).
# 문서 사이트의 빌드(pages.yml)와는 따로 실행된다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm의 버전은 src/package.json의 packageManager에서 읽는다
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: 웹 앱 빌드
        run: pnpm --filter @ariadne-nsd/web build

      # 첫 방문에 내려받는 것(HTML · JS · CSS · 화면 글꼴, gzip)이 한도 안인가 (QA-09)
      - name: 번들 사이즈 체크
        run: node apps/web/scripts/check-size.mjs

      - name: Playwright 브라우저 받기
        run: pnpm --filter @ariadne-nsd/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: E2E 보고서 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/apps/web/playwright-report/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Playwright 브라우저 받기
        run: pnpm --filter @ariadne-nsd/web exec playwright install --with-deps chromium

      # 패키지마다 단위 + E2E의 합친 줄 커버리지가 90% 이상인가
      - name: 커버리지 하한
        run: pnpm coverage:check

  co-change:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 커밋 범위의 처음까지 보려면 이력이 필요하다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 함께 바뀌어야 하는 곳의 짝: 지금은 경고만(::warning), 실패로 하지 않는다
      - name: 함께 바뀌는 곳의 검사
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            from=$(git merge-base "$BASE" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            from=$BEFORE
          else
            from=$(git rev-parse HEAD~1)
          fi
          node scripts/co-change.mjs --range "$from..HEAD" --warn
