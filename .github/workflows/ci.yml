# 코드(src/)를 검사한다 → docs/04-design/07-testing.md 4장, docs/07-coding-guide 1장
#
# pnpm check: 타입 검사 → 린트 → 포맷 확인 → 의존 방향 → 단위 테스트(골든 파일 포함)
# 그다음 웹 앱을 빌드해 첫 내려받기의 크기 예산을 보고(apps/web/scripts/check-size.mjs),
# Chromium으로 E2E를 실행한다(apps/web/e2e/).
# 문서 사이트의 빌드(pages.yml)와는 따로 실행된다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm의 버전은 src/package.json의 packageManager에서 읽는다
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: 웹 앱 빌드
        run: pnpm --filter @ariadne-nsd/web build

      # 첫 방문에 내려받는 것(HTML · JS · CSS · 화면 글꼴, gzip)이 예산 안인가 (QA-09)
      - name: 크기 예산
        run: node apps/web/scripts/check-size.mjs

      - name: Playwright 브라우저 받기
        run: pnpm --filter @ariadne-nsd/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: E2E 보고서 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/apps/web/playwright-report/
          retention-days: 7
