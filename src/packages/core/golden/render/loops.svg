<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="208" height="240" viewBox="0 0 208 240">
<rect width="100%" height="100%" fill="#ffffff"/>
<g class="ans-render" transform="translate(.5 .5)" font-family="'AriadneNSD Mono', D2Coding, Consolas, 'Malgun Gothic', 'Apple SD Gothic Neo', monospace" style="font-kerning:none">
<rect x="24" y="24" width="160" height="64" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="44" font-size="13" fill="#151a22" xml:space="preserve">i &lt; n</text>
<rect x="46" y="56" width="138" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="76" font-size="13" fill="#151a22" xml:space="preserve">i ← i + 1</text>
<rect x="24" y="88" width="160" height="64" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="140" font-size="13" fill="#151a22" xml:space="preserve">retry &gt; 0</text>
<rect x="46" y="88" width="138" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="108" font-size="13" fill="#151a22" xml:space="preserve">retry ← retry - 1</text>
<rect x="24" y="152" width="160" height="64" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="172" font-size="13" fill="#151a22" xml:space="preserve">k ← 1 .. 10</text>
<rect x="46" y="184" width="138" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="204" font-size="13" fill="#151a22" xml:space="preserve">print(k)</text>
</g>
</svg>
