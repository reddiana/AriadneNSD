<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="453" height="600" viewBox="0 0 453 600">
  <style>
    @font-face { font-family: "AriadneNSD Mono"; src: url(data:font/woff;base64,); }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="ans-render" transform="translate(.5 .5)" font-family="'AriadneNSD Mono', D2Coding, Consolas, 'Malgun Gothic', 'Apple SD Gothic Neo', monospace" style="font-kerning:none">
<text x="24" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Event</text>
<text x="24" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">TIM2 인터럽트 (1ms)</tspan></text>
<path d="M24 64 L429 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="24" y="64" width="405" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="84" font-size="13" fill="#151a22" xml:space="preserve">tick++;</text>
<rect x="24" y="96" width="405" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M24 96 L298 144 L429 96" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="298" y="114" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">btn_read(BTN1) == PRESSED</text>
<text x="30" y="139" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="423" y="139" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="24" y="144" width="274" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="164" font-size="13" fill="#151a22" xml:space="preserve">debounce_cnt++;</text>
<rect x="24" y="176" width="274" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M24 176 L246 224 L298 176" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="229.5" y="194" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">debounce_cnt &gt;= 20</text>
<text x="30" y="219" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="292" y="219" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="24" y="224" width="222" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="244" font-size="13" fill="#151a22" xml:space="preserve">led_toggle(LED1);  // 누름 확정</text>
<rect x="24" y="256" width="222" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="276" font-size="13" fill="#151a22" xml:space="preserve">debounce_cnt = 0;</text>
<rect x="246" y="224" width="52" height="64" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="272" cy="256" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M267.5 260.5 L276.5 251.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="298" y="144" width="131" height="144" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="308" y="164" font-size="13" fill="#151a22" xml:space="preserve">debounce_cnt = 0;</text>
<rect x="24" y="288" width="405" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="308" font-size="13" fill="#151a22" xml:space="preserve">adc_start(CH0);</text>
<rect x="24" y="320" width="405" height="64" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="340" font-size="13" fill="#151a22" xml:space="preserve">!adc_done()</text>
<rect x="46" y="352" width="383" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="372" font-size="13" fill="#151a22" xml:space="preserve">wait_us(10);</text>
<rect x="24" y="384" width="405" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="404" font-size="13" fill="#151a22" xml:space="preserve">temp = adc_value() * 0.1f;</text>
<rect x="24" y="416" width="405" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="436" font-size="13" fill="#151a22" xml:space="preserve">log_buf[log_i] = temp;</text>
<rect x="24" y="448" width="405" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="468" font-size="13" fill="#151a22" xml:space="preserve">log_i = (log_i + 1) % LOG_SIZE;</text>
<rect x="24" y="480" width="405" height="64" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="532" font-size="13" fill="#151a22" xml:space="preserve">uart_busy()</text>
<rect x="46" y="480" width="383" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="500" font-size="13" fill="#151a22" xml:space="preserve">uart_flush();</text>
<rect x="24" y="544" width="405" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="564" font-size="13" fill="#151a22" xml:space="preserve">return;</text>
</g>
</svg>
