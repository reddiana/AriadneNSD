<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="540" height="424" viewBox="0 0 540 424">
  <style>
    @font-face { font-family: "AriadneNSD Mono"; src: url(data:font/woff;base64,); }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="ans-render" transform="translate(.5 .5)" font-family="'AriadneNSD Mono', D2Coding, Consolas, 'Malgun Gothic', 'Apple SD Gothic Neo', monospace" style="font-kerning:none">
<text x="24" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Method</text>
<text x="24" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">quicksort(a, lo, hi)</tspan></text>
<path d="M24 64 L267 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="24" y="64" width="243" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M24 64 L215 112 L267 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="215" y="82" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">lo &lt; hi</text>
<text x="30" y="107" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="261" y="107" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="24" y="112" width="191" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M31 112 L31 144" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M208 112 L208 144" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="41" y="132" font-size="13" fill="#151a22" xml:space="preserve">p ← <tspan font-weight="600">partition</tspan>(a, lo, hi)</text>
<rect x="24" y="144" width="191" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M31 144 L31 176" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M208 144 L208 176" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="41" y="164" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">quicksort</tspan>(a, lo, p - 1)</text>
<rect x="24" y="176" width="191" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M31 176 L31 208" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M208 176 L208 208" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="41" y="196" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">quicksort</tspan>(a, p + 1, hi)</text>
<rect x="215" y="112" width="52" height="96" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="241" cy="160" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M236.5 164.5 L245.5 155.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<text x="311" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Method</text>
<text x="311" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">partition(a, lo, hi)</tspan></text>
<path d="M311 64 L516 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="311" y="64" width="205" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="321" y="84" font-size="13" fill="#151a22" xml:space="preserve">pivot = a[hi];</text>
<rect x="311" y="96" width="205" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="321" y="116" font-size="13" fill="#151a22" xml:space="preserve">i = lo - 1;</text>
<rect x="311" y="128" width="205" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="321" y="148" font-size="13" fill="#151a22" xml:space="preserve">j = lo;</text>
<rect x="311" y="160" width="205" height="176" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="321" y="180" font-size="13" fill="#151a22" xml:space="preserve">j &lt; hi</text>
<rect x="333" y="192" width="183" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M333 192 L464 240 L516 192" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="463.5" y="210" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">a[j] &lt;= pivot</text>
<text x="339" y="235" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="510" y="235" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="333" y="240" width="131" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="343" y="260" font-size="13" fill="#151a22" xml:space="preserve">i++;</text>
<rect x="333" y="272" width="131" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="343" y="292" font-size="13" fill="#151a22" xml:space="preserve">swap(a[i], a[j]);</text>
<rect x="464" y="240" width="52" height="64" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="490" cy="272" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M485.5 276.5 L494.5 267.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="333" y="304" width="183" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="343" y="324" font-size="13" fill="#151a22" xml:space="preserve">j++;</text>
<rect x="311" y="336" width="205" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="321" y="356" font-size="13" fill="#151a22" xml:space="preserve">swap(a[i + 1], a[hi]);</text>
<rect x="311" y="368" width="205" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="321" y="388" font-size="13" fill="#151a22" xml:space="preserve">return i + 1;</text>
</g>
</svg>
