<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="333" height="536" viewBox="0 0 333 536">
  <style>
    @font-face { font-family: "AriadneNSD Mono"; src: url(data:font/woff;base64,); }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="ans-render" transform="translate(.5 .5)" font-family="'AriadneNSD Mono', D2Coding, Consolas, 'Malgun Gothic', 'Apple SD Gothic Neo', monospace" style="font-kerning:none">
<text x="24" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Method</text>
<text x="24" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">dijkstra(graph, s)</tspan></text>
<path d="M24 64 L309 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="24" y="64" width="285" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="84" font-size="13" fill="#151a22" xml:space="preserve">dist = {v: INF for v in graph}</text>
<rect x="24" y="96" width="285" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="116" font-size="13" fill="#151a22" xml:space="preserve">dist[s] = 0</text>
<rect x="24" y="128" width="285" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="148" font-size="13" fill="#151a22" xml:space="preserve">pq = [(0, s)]</text>
<rect x="24" y="160" width="285" height="320" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="180" font-size="13" fill="#151a22" xml:space="preserve">pq</text>
<rect x="46" y="192" width="263" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="212" font-size="13" fill="#151a22" xml:space="preserve">d, u = heappop(pq)</text>
<rect x="46" y="224" width="263" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M46 224 L199 272 L309 224" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="199" y="242" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">d &gt; dist[u]</text>
<text x="52" y="267" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="303" y="267" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="46" y="272" width="153" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="292" font-size="13" fill="#151a22" xml:space="preserve">continue</text>
<rect x="199" y="272" width="110" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="254" cy="288" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M249.5 292.5 L258.5 283.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="46" y="304" width="263" height="176" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="324" font-size="13" fill="#151a22" xml:space="preserve">for v, w in graph[u]</text>
<rect x="68" y="336" width="241" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M68 336 L257 384 L309 336" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="230.5" y="354" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">dist[u] + w &lt; dist[v]</text>
<text x="74" y="379" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="303" y="379" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="68" y="384" width="189" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="78" y="404" font-size="13" fill="#151a22" xml:space="preserve">dist[v] = dist[u] + w</text>
<rect x="68" y="416" width="189" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="78" y="436" font-size="13" fill="#151a22" xml:space="preserve">prev[v] = u</text>
<rect x="68" y="448" width="189" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="78" y="468" font-size="13" fill="#151a22" xml:space="preserve">heappush(pq, (dist[v], v))</text>
<rect x="257" y="384" width="52" height="96" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="283" cy="432" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M278.5 436.5 L287.5 427.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="24" y="480" width="285" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="500" font-size="13" fill="#151a22" xml:space="preserve">return dist, prev</text>
</g>
</svg>
