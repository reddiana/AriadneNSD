<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="318" height="504" viewBox="0 0 318 504">
  <style>
    @font-face { font-family: "AriadneNSD Mono"; src: url(data:font/woff;base64,); }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="ans-render" transform="translate(.5 .5)" font-family="'AriadneNSD Mono', D2Coding, Consolas, 'Malgun Gothic', 'Apple SD Gothic Neo', monospace" style="font-kerning:none">
<text x="24" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Method</text>
<text x="24" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">merge_sort(a, lo, hi)</tspan></text>
<path d="M24 64 L294 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="24" y="64" width="270" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M24 64 L168 112 L294 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="168" y="82" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">hi - lo &lt; 2</text>
<text x="30" y="107" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="288" y="107" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="24" y="112" width="144" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="132" font-size="13" fill="#151a22" xml:space="preserve">return</text>
<rect x="168" y="112" width="126" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="231" cy="128" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M226.5 132.5 L235.5 123.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="24" y="144" width="270" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="164" font-size="13" fill="#151a22" xml:space="preserve">mid = (lo + hi) &gt;&gt; 1</text>
<rect x="24" y="176" width="270" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M31 176 L31 208" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M287 176 L287 208" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="41" y="196" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">merge_sort</tspan>(a, lo, mid)</text>
<rect x="24" y="208" width="270" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M31 208 L31 240" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M287 208 L287 240" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="41" y="228" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">merge_sort</tspan>(a, mid, hi)</text>
<rect x="24" y="240" width="270" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="260" font-size="13" fill="#151a22" xml:space="preserve">i, j, tmp = lo, mid, []</text>
<rect x="24" y="272" width="270" height="144" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="292" font-size="13" fill="#151a22" xml:space="preserve">i &lt; mid and j &lt; hi</text>
<rect x="46" y="304" width="248" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M46 304 L170 352 L294 304" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="170" y="322" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">a[i] &lt;= a[j]</text>
<text x="52" y="347" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="288" y="347" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="46" y="352" width="124" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="372" font-size="13" fill="#151a22" xml:space="preserve">tmp.append(a[i])</text>
<rect x="46" y="384" width="124" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="404" font-size="13" fill="#151a22" xml:space="preserve">i += 1</text>
<rect x="170" y="352" width="124" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="180" y="372" font-size="13" fill="#151a22" xml:space="preserve">tmp.append(a[j])</text>
<rect x="170" y="384" width="124" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="180" y="404" font-size="13" fill="#151a22" xml:space="preserve">j += 1</text>
<rect x="24" y="416" width="270" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="436" font-size="13" fill="#151a22" xml:space="preserve">tmp += a[i:mid] + a[j:hi]</text>
<rect x="24" y="448" width="270" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="468" font-size="13" fill="#151a22" xml:space="preserve">a[lo:hi] = tmp</text>
</g>
</svg>
