<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="676" height="520" viewBox="0 0 676 520">
  <style>
    @font-face { font-family: "AriadneNSD Mono"; src: url(data:font/woff;base64,); }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="ans-render" transform="translate(.5 .5)" font-family="'AriadneNSD Mono', D2Coding, Consolas, 'Malgun Gothic', 'Apple SD Gothic Neo', monospace" style="font-kerning:none">
<text x="24" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Event</text>
<text x="24" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">main()</tspan></text>
<path d="M24 64 L292 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="24" y="64" width="268" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="84" font-size="13" fill="#151a22" xml:space="preserve">maze = read_maze()</text>
<rect x="24" y="96" width="268" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M31 96 L31 128" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M285 96 L285 128" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="41" y="116" font-size="13" fill="#151a22" xml:space="preserve">found ← <tspan font-weight="600">solve</tspan>(maze, maze.entrance)</text>
<rect x="24" y="128" width="268" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M24 128 L155 176 L292 128" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="155" y="146" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">found</text>
<text x="30" y="171" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="286" y="171" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="24" y="176" width="131" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="196" font-size="13" fill="#151a22" xml:space="preserve">draw_thread(path)</text>
<rect x="155" y="176" width="137" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="165" y="196" font-size="13" fill="#151a22" xml:space="preserve">print("출구 없음")</text>
<text x="380" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Method</text>
<text x="380" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">solve(maze, p)</tspan></text>
<path d="M380 64 L652 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="380" y="64" width="272" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M380 64 L554 112 L652 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="554" y="82" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">p == maze.exit</text>
<text x="386" y="107" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="646" y="107" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="380" y="112" width="174" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="390" y="132" font-size="13" fill="#151a22" xml:space="preserve">return True</text>
<rect x="554" y="112" width="98" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="603" cy="128" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M598.5 132.5 L607.5 123.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="380" y="144" width="272" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M380 144 L558 192 L652 144" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="551" y="162" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">maze.wall(p) or p in visited</text>
<text x="386" y="187" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="646" y="187" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="380" y="192" width="178" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="390" y="212" font-size="13" fill="#151a22" xml:space="preserve">return False</text>
<rect x="558" y="192" width="94" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="605" cy="208" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M600.5 212.5 L609.5 203.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="380" y="224" width="272" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="390" y="244" font-size="13" fill="#151a22" xml:space="preserve">visited.add(p)</text>
<rect x="380" y="256" width="272" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="390" y="276" font-size="13" fill="#151a22" xml:space="preserve">path.append(p)    # 실을 푼다</text>
<rect x="380" y="288" width="272" height="144" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="390" y="308" font-size="13" fill="#151a22" xml:space="preserve">for d in (N, E, S, W)</text>
<rect x="402" y="320" width="250" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M409 320 L409 352" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M645 320 L645 352" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="419" y="340" font-size="13" fill="#151a22" xml:space="preserve">ok ← <tspan font-weight="600">solve</tspan>(maze, p + d)</text>
<rect x="402" y="352" width="250" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M402 352 L562 400 L652 352" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="562" y="370" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">ok</text>
<text x="408" y="395" font-size="12" fill="#4b5567" xml:space="preserve">true</text>
<text x="646" y="395" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">false</text>
<rect x="402" y="400" width="160" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="412" y="420" font-size="13" fill="#151a22" xml:space="preserve">return True</text>
<rect x="562" y="400" width="90" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<circle cx="607" cy="416" r="3.5" fill="none" stroke="#5a6476" stroke-width="1.1"/>
<path d="M602.5 420.5 L611.5 411.5" fill="none" stroke="#5a6476" stroke-width="1.1" stroke-linecap="round"/>
<rect x="380" y="432" width="272" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="390" y="452" font-size="13" fill="#151a22" xml:space="preserve">path.pop()        # 실을 감는다</text>
<rect x="380" y="464" width="272" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="390" y="484" font-size="13" fill="#151a22" xml:space="preserve">return False</text>
</g>
</svg>
