<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="776" height="376" viewBox="0 0 776 376">
  <style>
    @font-face { font-family: "AriadneNSD Mono"; src: url(data:font/woff;base64,); }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g class="ans-render" transform="translate(.5 .5)" font-family="'AriadneNSD Mono', D2Coding, Consolas, 'Malgun Gothic', 'Apple SD Gothic Neo', monospace" style="font-kerning:none">
<text x="24" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Event</text>
<text x="24" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">main()</tspan></text>
<path d="M24 64 L340 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="24" y="64" width="316" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="84" font-size="13" fill="#151a22" xml:space="preserve">int a[] = {2, 3, 5, 7, 11, 13, 17};</text>
<rect x="24" y="96" width="316" height="176" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="34" y="260" font-size="13" fill="#151a22" xml:space="preserve">key != 0</text>
<rect x="46" y="96" width="294" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="116" font-size="13" fill="#151a22" xml:space="preserve">key = read_int();</text>
<rect x="46" y="128" width="294" height="32" fill="#ebe7f4" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M53 128 L53 160" fill="none" stroke="#5b77ad" stroke-width="1"/>
<path d="M333 128 L333 160" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="63" y="148" font-size="13" fill="#151a22" xml:space="preserve">i ← <tspan font-weight="600">binary_search</tspan>(a, 7, key)</text>
<rect x="46" y="160" width="294" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M46 160 L209 208 L340 160" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="209" y="178" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">i &gt;= 0</text>
<text x="52" y="203" font-size="12" fill="#4b5567" xml:space="preserve">참</text>
<text x="334" y="203" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">거짓</text>
<rect x="46" y="208" width="163" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="56" y="228" font-size="13" fill="#151a22" xml:space="preserve">printf("%d번째\n", i);</text>
<rect x="209" y="208" width="131" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="219" y="228" font-size="13" fill="#151a22" xml:space="preserve">printf("없음\n");</text>
<text x="428" y="36" font-size="12" fill="#5a6476" xml:space="preserve">Method</text>
<text x="428" y="53" font-size="13" fill="#151a22" xml:space="preserve"><tspan font-weight="600">binary_search(a, n, key)</tspan></text>
<path d="M428 64 L752 64" fill="none" stroke="#5b77ad" stroke-width="1"/>
<rect x="428" y="64" width="324" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="438" y="84" font-size="13" fill="#151a22" xml:space="preserve">lo = 0;</text>
<rect x="428" y="96" width="324" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="438" y="116" font-size="13" fill="#151a22" xml:space="preserve">hi = n - 1;</text>
<rect x="428" y="128" width="324" height="192" fill="#dce6f6" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="438" y="148" font-size="13" fill="#151a22" xml:space="preserve">lo &lt;= hi</text>
<rect x="450" y="160" width="302" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="460" y="180" font-size="13" fill="#151a22" xml:space="preserve">mid = lo + (hi - lo) / 2;</text>
<rect x="450" y="192" width="302" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M450 192 L542 240 L752 192" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="542" y="210" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">a[mid] == key</text>
<text x="456" y="235" font-size="12" fill="#4b5567" xml:space="preserve">참</text>
<text x="746" y="235" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">거짓</text>
<rect x="450" y="240" width="92" height="80" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="460" y="260" font-size="13" fill="#151a22" xml:space="preserve">return mid;</text>
<rect x="542" y="240" width="210" height="48" fill="#f6ebdc" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<path d="M542 240 L647 288 L752 240" fill="none" stroke="#5b77ad" stroke-width="1"/>
<text x="647" y="258" text-anchor="middle" font-size="13" fill="#151a22" stroke="#f6ebdc" stroke-width="6" stroke-linejoin="round" paint-order="stroke" xml:space="preserve">a[mid] &lt; key</text>
<text x="548" y="283" font-size="12" fill="#4b5567" xml:space="preserve">참</text>
<text x="746" y="283" text-anchor="end" font-size="12" fill="#4b5567" xml:space="preserve">거짓</text>
<rect x="542" y="288" width="105" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="552" y="308" font-size="13" fill="#151a22" xml:space="preserve">lo = mid + 1;</text>
<rect x="647" y="288" width="105" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="657" y="308" font-size="13" fill="#151a22" xml:space="preserve">hi = mid - 1;</text>
<rect x="428" y="320" width="324" height="32" fill="#edf0f5" stroke="#5b77ad" stroke-width="1" shape-rendering="crispEdges"/>
<text x="438" y="340" font-size="13" fill="#151a22" xml:space="preserve">return -1;</text>
</g>
</svg>
