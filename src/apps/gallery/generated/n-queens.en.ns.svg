<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="848" height="472" viewBox="0 0 848 472">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="90f3c1500b31bd37fc2f7ed65792974c2942665a73bc8e5467ed9a25b33495b9"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "en"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "event",
        "text": "main()"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "n = 8"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "board, solutions = [], []"
        },
        {
          "id": "b3",
          "kind": "process",
          "text": "cols, diag1, diag2 = set(), set(), set()"
        },
        {
          "id": "b4",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "0",
          "result": ""
        },
        {
          "id": "b5",
          "kind": "process",
          "text": "print(len(solutions))    # 92 solutions"
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "place(row)"
      },
      "body": [
        {
          "id": "b6",
          "kind": "if",
          "text": "row == n",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b7",
                "kind": "process",
                "text": "solutions.append(board[:])    # every queen placed"
              },
              {
                "id": "b8",
                "kind": "exit",
                "text": "return"
              }
            ]
          },
          "no": {
            "id": "r2",
            "body": [
              {
                "id": "b9",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b10",
          "kind": "for",
          "text": "for c in range(n)",
          "body": [
            {
              "id": "b11",
              "kind": "if",
              "text": "c in cols or row - c in diag1 or row + c in diag2",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b12",
                    "kind": "exit",
                    "text": "continue    # attacked square"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b13",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b14",
              "kind": "process",
              "text": "board.append(c)    # try it here"
            },
            {
              "id": "b15",
              "kind": "process",
              "text": "cols.add(c); diag1.add(row - c); diag2.add(row + c)"
            },
            {
              "id": "b16",
              "kind": "call",
              "target": {
                "kind": "local",
                "diagram": "d2"
              },
              "args": "row + 1",
              "result": ""
            },
            {
              "id": "b17",
              "kind": "process",
              "text": "board.pop()    # take it back"
            },
            {
              "id": "b18",
              "kind": "process",
              "text": "cols.remove(c); diag1.remove(row - c); diag2.remove(row + c)"
            }
          ]
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
