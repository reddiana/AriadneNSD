<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="857" height="680" viewBox="0 0 857 680">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="405c0450c7e99b05cda8f7634405a84609aa5947f73d035103c4c322c6e6a9fb"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "de"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "a_star(graph, start, goal, h)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "g = {start: 0}    # Kosten vom Start"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "came_from = {}"
        },
        {
          "id": "b3",
          "kind": "process",
          "text": "open = [(h(start), start)]"
        },
        {
          "id": "b4",
          "kind": "while",
          "text": "open",
          "body": [
            {
              "id": "b5",
              "kind": "process",
              "text": "f, u = heappop(open)"
            },
            {
              "id": "b6",
              "kind": "if",
              "text": "f > g[u] + h(u)",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b7",
                    "kind": "exit",
                    "text": "continue    # veralteter Eintrag: inzwischen wurde ein kürzerer Weg gefunden"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b8",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b9",
              "kind": "if",
              "text": "u == goal",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b10",
                    "kind": "call",
                    "target": {
                      "kind": "local",
                      "diagram": "d2"
                    },
                    "args": "came_from, u",
                    "result": "path"
                  },
                  {
                    "id": "b11",
                    "kind": "exit",
                    "text": "return path"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b12",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b13",
              "kind": "for",
              "text": "for v, w in graph[u]",
              "body": [
                {
                  "id": "b14",
                  "kind": "process",
                  "text": "tentative = g[u] + w"
                },
                {
                  "id": "b15",
                  "kind": "if",
                  "text": "tentative < g.get(v, INF)",
                  "yes": {
                    "id": "r5",
                    "body": [
                      {
                        "id": "b16",
                        "kind": "process",
                        "text": "came_from[v] = u    # kürzeren Weg gefunden"
                      },
                      {
                        "id": "b17",
                        "kind": "process",
                        "text": "g[v] = tentative"
                      },
                      {
                        "id": "b18",
                        "kind": "process",
                        "text": "heappush(open, (tentative + h(v), v))"
                      }
                    ]
                  },
                  "no": {
                    "id": "r6",
                    "body": [
                      {
                        "id": "b19",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b20",
          "kind": "process",
          "text": "return None    # kein Weg"
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "reconstruct(came_from, u)"
      },
      "body": [
        {
          "id": "b21",
          "kind": "process",
          "text": "path = [u]"
        },
        {
          "id": "b22",
          "kind": "while",
          "text": "u in came_from",
          "body": [
            {
              "id": "b23",
              "kind": "process",
              "text": "u = came_from[u]"
            },
            {
              "id": "b24",
              "kind": "process",
              "text": "path.append(u)"
            }
          ]
        },
        {
          "id": "b25",
          "kind": "process",
          "text": "return path[::-1]"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
