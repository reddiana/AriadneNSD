<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="686" height="654" viewBox="0 0 686 654">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="957ecdb1edec9d152755ca067147c65b6d088e94105b5f66e29a5c1e6a521a11"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "en"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "knapsack(w, v, W)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "n = len(w)"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "dp = [[0] * (W + 1) for _ in range(n + 1)]    # best value of the first i items within weight c"
        },
        {
          "id": "b3",
          "kind": "for",
          "text": "for i in range(1, n + 1)",
          "body": [
            {
              "id": "b4",
              "kind": "for",
              "text": "for c in range(W + 1)",
              "body": [
                {
                  "id": "b5",
                  "kind": "process",
                  "text": "dp[i][c] = dp[i - 1][c]    # leave item i out"
                },
                {
                  "id": "b6",
                  "kind": "if",
                  "text": "w[i - 1] <= c",
                  "yes": {
                    "id": "r1",
                    "body": [
                      {
                        "id": "b7",
                        "kind": "process",
                        "text": "take = dp[i - 1][c - w[i - 1]] + v[i - 1]    # put item i in"
                      },
                      {
                        "id": "b8",
                        "kind": "if",
                        "text": "take > dp[i][c]",
                        "yes": {
                          "id": "r2",
                          "body": [
                            {
                              "id": "b9",
                              "kind": "process",
                              "text": "dp[i][c] = take"
                            }
                          ]
                        },
                        "no": {
                          "id": "r3",
                          "body": [
                            {
                              "id": "b10",
                              "kind": "process",
                              "text": ""
                            }
                          ]
                        }
                      }
                    ]
                  },
                  "no": {
                    "id": "r4",
                    "body": [
                      {
                        "id": "b11",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b12",
          "kind": "process",
          "text": "items, c = [], W"
        },
        {
          "id": "b13",
          "kind": "for",
          "text": "for i in range(n, 0, -1)",
          "body": [
            {
              "id": "b14",
              "kind": "if",
              "text": "dp[i][c] != dp[i - 1][c]",
              "yes": {
                "id": "r5",
                "body": [
                  {
                    "id": "b15",
                    "kind": "process",
                    "text": "items.append(i - 1)    # this item was taken"
                  },
                  {
                    "id": "b16",
                    "kind": "process",
                    "text": "c -= w[i - 1]"
                  }
                ]
              },
              "no": {
                "id": "r6",
                "body": [
                  {
                    "id": "b17",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b18",
          "kind": "process",
          "text": "return dp[n][W], items"
        }
      ],
      "folds": [
        {
          "id": "f1",
          "first": "b3",
          "last": "b3",
          "name": "Fill the table"
        },
        {
          "id": "f2",
          "first": "b12",
          "last": "b13",
          "name": "Read the chosen items back"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
