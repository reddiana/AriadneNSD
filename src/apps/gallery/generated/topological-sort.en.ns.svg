<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="588" height="650" viewBox="0 0 588 650">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="de814623c1733ae11e3f9dbf0cc7c2c0fe53561194620c4d10495936094fcfcd"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "en"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "topo_sort(graph)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "indeg = {v: 0 for v in graph}"
        },
        {
          "id": "b2",
          "kind": "for",
          "text": "for u in graph",
          "body": [
            {
              "id": "b3",
              "kind": "for",
              "text": "for v in graph[u]",
              "body": [
                {
                  "id": "b4",
                  "kind": "process",
                  "text": "indeg[v] += 1"
                }
              ]
            }
          ]
        },
        {
          "id": "b5",
          "kind": "process",
          "text": "q = deque(v for v in graph if indeg[v] == 0)    # vertices with no incoming edge"
        },
        {
          "id": "b6",
          "kind": "process",
          "text": "order = []"
        },
        {
          "id": "b7",
          "kind": "while",
          "text": "q",
          "body": [
            {
              "id": "b8",
              "kind": "process",
              "text": "u = q.popleft()"
            },
            {
              "id": "b9",
              "kind": "process",
              "text": "order.append(u)"
            },
            {
              "id": "b10",
              "kind": "for",
              "text": "for v in graph[u]",
              "body": [
                {
                  "id": "b11",
                  "kind": "process",
                  "text": "indeg[v] -= 1"
                },
                {
                  "id": "b12",
                  "kind": "if",
                  "text": "indeg[v] == 0",
                  "yes": {
                    "id": "r1",
                    "body": [
                      {
                        "id": "b13",
                        "kind": "process",
                        "text": "q.append(v)"
                      }
                    ]
                  },
                  "no": {
                    "id": "r2",
                    "body": [
                      {
                        "id": "b14",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b15",
          "kind": "if",
          "text": "len(order) < len(graph)",
          "yes": {
            "id": "r3",
            "body": [
              {
                "id": "b16",
                "kind": "process",
                "text": "return None    # there is a cycle"
              }
            ]
          },
          "no": {
            "id": "r4",
            "body": [
              {
                "id": "b17",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b18",
          "kind": "process",
          "text": "return order"
        }
      ],
      "folds": [
        {
          "id": "f1",
          "first": "b1",
          "last": "b2",
          "name": "Count incoming edges"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
