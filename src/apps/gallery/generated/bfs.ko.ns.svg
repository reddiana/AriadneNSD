  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="aa8dbe846129cf71d25535140a043e74412d8488932f8475e67b2f8c9b2822a2"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "bfs(grid, start, goal)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "dist = {start: 0}"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "q = deque([start])"
        },
        {
          "id": "b3",
          "kind": "while",
          "text": "q",
          "body": [
            {
              "id": "b4",
              "kind": "process",
              "text": "p = q.popleft()"
            },
            {
              "id": "b5",
              "kind": "if",
              "text": "p == goal",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b6",
                    "kind": "exit",
                    "text": "return dist[p]"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b7",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b8",
              "kind": "for",
              "text": "for d in (N, E, S, W)",
              "body": [
                {
                  "id": "b9",
                  "kind": "process",
                  "text": "n = p + d"
                },
                {
                  "id": "b10",
                  "kind": "if",
                  "text": "grid.open(n) and n not in dist",
                  "yes": {
                    "id": "r3",
                    "body": [
                      {
                        "id": "b11",
                        "kind": "process",
                        "text": "dist[n] = dist[p] + 1    # 처음 닿을 때가 가장 가깝다"
                      },
                      {
                        "id": "b12",
                        "kind": "process",
                        "text": "q.append(n)"
                      }
                    ]
                  },
                  "no": {
                    "id": "r4",
                    "body": [
                      {
                        "id": "b13",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b14",
          "kind": "process",
          "text": "return -1    # 갈 수 없다"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
