<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1154" height="696" viewBox="0 0 1154 696">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="5d15fa9638d1dc999d7e535d57ac49a4423d5e893ee37bfff20ab8b353aeeca5"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "de"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "life_step(grid)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "rows, cols = len(grid), len(grid[0])"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "nxt = [[0] * cols for _ in range(rows)]    # die nächste Generation auf ein neues Feld"
        },
        {
          "id": "b3",
          "kind": "for",
          "text": "for r in range(rows)",
          "body": [
            {
              "id": "b4",
              "kind": "for",
              "text": "for c in range(cols)",
              "body": [
                {
                  "id": "b5",
                  "kind": "call",
                  "target": {
                    "kind": "local",
                    "diagram": "d2"
                  },
                  "args": "grid, r, c",
                  "result": "n"
                },
                {
                  "id": "b6",
                  "kind": "case",
                  "text": "n",
                  "arms": [
                    {
                      "id": "r1",
                      "label": "2",
                      "body": [
                        {
                          "id": "b7",
                          "kind": "process",
                          "text": "nxt[r][c] = grid[r][c]    # bleibt, wie sie ist"
                        }
                      ]
                    },
                    {
                      "id": "r2",
                      "label": "3",
                      "body": [
                        {
                          "id": "b8",
                          "kind": "process",
                          "text": "nxt[r][c] = 1    # wird geboren oder überlebt"
                        }
                      ]
                    }
                  ],
                  "otherwise": {
                    "id": "r3",
                    "body": [
                      {
                        "id": "b9",
                        "kind": "process",
                        "text": "nxt[r][c] = 0    # stirbt an Vereinsamung oder Überbevölkerung"
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b10",
          "kind": "process",
          "text": "return nxt"
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "live_neighbors(grid, r, c)"
      },
      "body": [
        {
          "id": "b11",
          "kind": "process",
          "text": "rows, cols = len(grid), len(grid[0])"
        },
        {
          "id": "b12",
          "kind": "process",
          "text": "n = 0"
        },
        {
          "id": "b13",
          "kind": "for",
          "text": "for dr in (-1, 0, 1)",
          "body": [
            {
              "id": "b14",
              "kind": "for",
              "text": "for dc in (-1, 0, 1)",
              "body": [
                {
                  "id": "b15",
                  "kind": "if",
                  "text": "(dr, dc) != (0, 0)",
                  "yes": {
                    "id": "r4",
                    "body": [
                      {
                        "id": "b16",
                        "kind": "process",
                        "text": "n += grid[(r + dr) % rows][(c + dc) % cols]    # die Ränder sind miteinander verbunden"
                      }
                    ]
                  },
                  "no": {
                    "id": "r5",
                    "body": [
                      {
                        "id": "b17",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b18",
          "kind": "process",
          "text": "return n"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
