    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="79d4fc5ccd24ec27d752912a0383407f4dc6a6e43316d43110dd99cede248f8a"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "de"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "event",
        "text": "main()"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "int a[] = {2, 3, 5, 7, 11, 13, 17};"
        },
        {
          "id": "b2",
          "kind": "doWhile",
          "text": "key != 0",
          "body": [
            {
              "id": "b3",
              "kind": "process",
              "text": "key = read_int();"
            },
            {
              "id": "b4",
              "kind": "call",
              "target": {
                "kind": "local",
                "diagram": "d2"
              },
              "args": "a, 7, key",
              "result": "i"
            },
            {
              "id": "b5",
              "kind": "if",
              "text": "i >= 0",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b6",
                    "kind": "process",
                    "text": "printf(\"gefunden an Stelle %d\\n\", i);"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b7",
                    "kind": "process",
                    "text": "printf(\"nicht gefunden\\n\");"
                  }
                ]
              }
            }
          ]
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "binary_search(a, n, key)"
      },
      "body": [
        {
          "id": "b8",
          "kind": "process",
          "text": "lo = 0;"
        },
        {
          "id": "b9",
          "kind": "process",
          "text": "hi = n - 1;"
        },
        {
          "id": "b10",
          "kind": "while",
          "text": "lo <= hi",
          "body": [
            {
              "id": "b11",
              "kind": "process",
              "text": "mid = lo + (hi - lo) / 2;"
            },
            {
              "id": "b12",
              "kind": "if",
              "text": "a[mid] == key",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b13",
                    "kind": "exit",
                    "text": "return mid;"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b14",
                    "kind": "if",
                    "text": "a[mid] < key",
                    "yes": {
                      "id": "r5",
                      "body": [
                        {
                          "id": "b15",
                          "kind": "process",
                          "text": "lo = mid + 1;"
                        }
                      ]
                    },
                    "no": {
                      "id": "r6",
                      "body": [
                        {
                          "id": "b16",
                          "kind": "process",
                          "text": "hi = mid - 1;"
                        }
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b17",
          "kind": "process",
          "text": "return -1;"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
