{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "en"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "event",
        "text": "main()"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "n = 3    # 2**3 - 1 = 7 moves"
        },
        {
          "id": "b2",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "n, \"A\", \"C\", \"B\"",
          "result": ""
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "hanoi(n, src, dst, via)"
      },
      "body": [
        {
          "id": "b3",
          "kind": "if",
          "text": "n == 0",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b4",
                "kind": "exit",
                "text": "return"
              }
            ]
          },
          "no": {
            "id": "r2",
            "body": [
              {
                "id": "b5",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b6",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "n - 1, src, via, dst",
          "result": ""
        },
        {
          "id": "b7",
          "kind": "process",
          "text": "print(f\"disk {n}: {src} -> {dst}\")    # the n - 1 above wait on via"
        },
        {
          "id": "b8",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "n - 1, via, dst, src",
          "result": ""
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
