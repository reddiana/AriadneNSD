          "id": "b9",
          "kind": "endless",
          "body": [
            {
              "id": "b10",
              "kind": "process",
              "text": "item = produce()    # None when done"
            },
            {
              "id": "b11",
              "kind": "process",
              "text": "empty.acquire()     # wait for a free slot"
            },
            {
              "id": "b12",
              "kind": "process",
              "text": "with mutex: buf.append(item)"
            },
            {
              "id": "b13",
              "kind": "process",
              "text": "full.release()"
            },
