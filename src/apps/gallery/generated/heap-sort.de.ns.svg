  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="57821b3ef7d93b61886e2f5a71fb56055a0cce9cc0d7b38f2486a97342b035e3"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "de"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "heap_sort(a)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "n = len(a)"
        },
        {
          "id": "b2",
          "kind": "for",
          "text": "for i in range(n // 2 - 1, -1, -1)",
          "body": [
            {
              "id": "b3",
              "kind": "call",
              "target": {
                "kind": "local",
                "diagram": "d2"
              },
              "args": "a, i, n",
              "result": ""
            }
          ]
        },
        {
          "id": "b4",
          "kind": "for",
          "text": "for end in range(n - 1, 0, -1)",
          "body": [
            {
              "id": "b5",
              "kind": "process",
              "text": "a[0], a[end] = a[end], a[0]    # das größte nach hinten"
            },
            {
              "id": "b6",
              "kind": "call",
              "target": {
                "kind": "local",
                "diagram": "d2"
              },
              "args": "a, 0, end",
              "result": ""
            }
          ]
        }
      ],
      "folds": [
        {
          "id": "f1",
          "first": "b2",
          "last": "b2",
          "name": "Max-Heap aufbauen"
        },
        {
          "id": "f2",
          "first": "b4",
          "last": "b4",
          "name": "Einzeln entnehmen"
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "sift_down(a, i, n)"
      },
      "body": [
        {
          "id": "b7",
          "kind": "endless",
          "body": [
            {
              "id": "b8",
              "kind": "process",
              "text": "largest = i"
            },
            {
              "id": "b9",
              "kind": "process",
              "text": "l, r = 2 * i + 1, 2 * i + 2"
            },
            {
              "id": "b10",
              "kind": "if",
              "text": "l < n and a[l] > a[largest]",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b11",
                    "kind": "process",
                    "text": "largest = l"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b12",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b13",
              "kind": "if",
              "text": "r < n and a[r] > a[largest]",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b14",
                    "kind": "process",
                    "text": "largest = r"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b15",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b16",
              "kind": "if",
              "text": "largest == i",
              "yes": {
                "id": "r5",
                "body": [
                  {
                    "id": "b17",
                    "kind": "exit",
                    "text": "return    # Heap-Eigenschaft gilt"
                  }
                ]
              },
              "no": {
                "id": "r6",
                "body": [
                  {
                    "id": "b18",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b19",
              "kind": "process",
              "text": "a[i], a[largest] = a[largest], a[i]"
            },
            {
              "id": "b20",
              "kind": "process",
              "text": "i = largest"
            }
          ]
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
