  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="edebb2d629fc1700ccea2a842ab041dd4e3adb1e280a54cd2c86d899e4110be8"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "de"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "lcs(a, b)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "n, m = len(a), len(b)"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "L = [[0] * (m + 1) for _ in range(n + 1)]    # LCS-Länge von a[:i] und b[:j]"
        },
        {
          "id": "b3",
          "kind": "for",
          "text": "for i in range(1, n + 1)",
          "body": [
            {
              "id": "b4",
              "kind": "for",
              "text": "for j in range(1, m + 1)",
              "body": [
                {
                  "id": "b5",
                  "kind": "if",
                  "text": "a[i - 1] == b[j - 1]",
                  "yes": {
                    "id": "r1",
                    "body": [
                      {
                        "id": "b6",
                        "kind": "process",
                        "text": "L[i][j] = L[i - 1][j - 1] + 1"
                      }
                    ]
                  },
                  "no": {
                    "id": "r2",
                    "body": [
                      {
                        "id": "b7",
                        "kind": "process",
                        "text": "L[i][j] = max(L[i - 1][j], L[i][j - 1])"
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b8",
          "kind": "process",
          "text": "i, j, out = n, m, []"
        },
        {
          "id": "b9",
          "kind": "while",
          "text": "i > 0 and j > 0",
          "body": [
            {
              "id": "b10",
              "kind": "if",
              "text": "a[i - 1] == b[j - 1]",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b11",
                    "kind": "process",
                    "text": "out.append(a[i - 1])    # ein Zeichen in beiden"
                  },
                  {
                    "id": "b12",
                    "kind": "process",
                    "text": "i -= 1"
                  },
                  {
                    "id": "b13",
                    "kind": "process",
                    "text": "j -= 1"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b14",
                    "kind": "if",
                    "text": "L[i - 1][j] >= L[i][j - 1]",
                    "yes": {
                      "id": "r5",
                      "body": [
                        {
                          "id": "b15",
                          "kind": "process",
                          "text": "i -= 1"
                        }
                      ]
                    },
                    "no": {
                      "id": "r6",
                      "body": [
                        {
                          "id": "b16",
                          "kind": "process",
                          "text": "j -= 1"
                        }
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b17",
          "kind": "process",
          "text": "return ''.join(reversed(out))"
        }
      ],
      "folds": [
        {
          "id": "f1",
          "first": "b3",
          "last": "b3",
          "name": "Tabelle füllen"
        },
        {
          "id": "f2",
          "first": "b8",
          "last": "b9",
          "name": "Tabelle rückwärts durchlaufen"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
