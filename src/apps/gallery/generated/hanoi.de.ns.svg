      },
      "body": [
        {
          "id": "b3",
          "kind": "if",
          "text": "n == 0",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b4",
                "kind": "exit",
                "text": "return"
              }
            ]
          },
