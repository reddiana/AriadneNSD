            "id": "r2",
            "body": [
              {
                "id": "b5",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b6",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "n - 1, src, via, dst",
          "result": ""
        },
        {
          "id": "b7",
          "kind": "process",
          "text": "print(f\"Scheibe {n}: {src} -> {dst}\")    # die n - 1 oberen warten auf via"
        },
        {
          "id": "b8",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "n - 1, via, dst, src",
          "result": ""
        }
      ]
    }
  ],
