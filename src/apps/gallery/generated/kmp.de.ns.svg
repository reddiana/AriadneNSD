  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="3a4cc7c2f587d91afe16df2cc7d836d1a7e6523c174ccf4fc360dd647b3a508e"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "de"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "kmp_search(text, pat)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "pat",
          "result": "pi"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "matches, k = [], 0"
        },
        {
          "id": "b3",
          "kind": "for",
          "text": "for i, c in enumerate(text)",
          "body": [
            {
              "id": "b4",
              "kind": "while",
              "text": "k > 0 and c != pat[k]",
              "body": [
                {
                  "id": "b5",
                  "kind": "process",
                  "text": "k = pi[k - 1]    # im Muster zurückfallen"
                }
              ]
            },
            {
              "id": "b6",
              "kind": "if",
              "text": "c == pat[k]",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b7",
                    "kind": "process",
                    "text": "k += 1"
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b8",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b9",
              "kind": "if",
              "text": "k == len(pat)",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b10",
                    "kind": "process",
                    "text": "matches.append(i - k + 1)    # gefunden"
                  },
                  {
                    "id": "b11",
                    "kind": "process",
                    "text": "k = pi[k - 1]"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b12",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b13",
          "kind": "process",
          "text": "return matches"
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "prefix_function(p)"
      },
      "body": [
        {
          "id": "b14",
          "kind": "process",
          "text": "pi = [0] * len(p)    # längstes echtes Präfix von p[:i+1], das auch sein Suffix ist"
        },
        {
          "id": "b15",
          "kind": "process",
          "text": "k = 0"
        },
        {
          "id": "b16",
          "kind": "for",
          "text": "for i in range(1, len(p))",
          "body": [
            {
              "id": "b17",
              "kind": "while",
              "text": "k > 0 and p[i] != p[k]",
              "body": [
                {
                  "id": "b18",
                  "kind": "process",
                  "text": "k = pi[k - 1]"
                }
              ]
            },
            {
              "id": "b19",
              "kind": "if",
              "text": "p[i] == p[k]",
              "yes": {
                "id": "r5",
                "body": [
                  {
                    "id": "b20",
                    "kind": "process",
                    "text": "k += 1"
                  }
                ]
              },
              "no": {
                "id": "r6",
                "body": [
                  {
                    "id": "b21",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b22",
              "kind": "process",
              "text": "pi[i] = k"
            }
          ]
        },
        {
          "id": "b23",
          "kind": "process",
          "text": "return pi"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
