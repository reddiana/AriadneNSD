<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="683" height="520" viewBox="0 0 683 520">
  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="b0b637af696719177b1d18e22059a1d2bf298b1c336313c5fac3e8e81de3c9d0"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "en"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "event",
        "text": "main()"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "maze = read_maze()"
        },
        {
          "id": "b2",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d2"
          },
          "args": "maze, maze.entrance",
          "result": "found"
        },
        {
          "id": "b3",
          "kind": "if",
          "text": "found",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b4",
                "kind": "process",
                "text": "draw_thread(path)"
              }
            ]
          },
          "no": {
            "id": "r2",
            "body": [
              {
                "id": "b5",
                "kind": "process",
                "text": "print(\"no way out\")"
              }
            ]
          }
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "solve(maze, p)"
      },
      "body": [
        {
          "id": "b6",
          "kind": "if",
          "text": "p == maze.exit",
          "yes": {
            "id": "r3",
            "body": [
              {
                "id": "b7",
                "kind": "exit",
                "text": "return True"
              }
            ]
          },
          "no": {
            "id": "r4",
            "body": [
              {
                "id": "b8",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b9",
          "kind": "if",
          "text": "maze.wall(p) or p in visited",
          "yes": {
            "id": "r5",
            "body": [
              {
                "id": "b10",
                "kind": "exit",
                "text": "return False"
              }
            ]
          },
          "no": {
            "id": "r6",
            "body": [
              {
                "id": "b11",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b12",
          "kind": "process",
          "text": "visited.add(p)"
        },
        {
          "id": "b13",
          "kind": "process",
          "text": "path.append(p)    # unwind the thread"
        },
        {
          "id": "b14",
          "kind": "while",
          "text": "for d in (N, E, S, W)",
          "body": [
            {
              "id": "b15",
              "kind": "call",
              "target": {
                "kind": "local",
                "diagram": "d2"
              },
              "args": "maze, p + d",
              "result": "ok"
            },
            {
              "id": "b16",
              "kind": "if",
              "text": "ok",
              "yes": {
                "id": "r7",
                "body": [
                  {
                    "id": "b17",
                    "kind": "exit",
                    "text": "return True"
                  }
                ]
              },
              "no": {
                "id": "r8",
                "body": [
                  {
                    "id": "b18",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b19",
          "kind": "process",
          "text": "path.pop()        # wind it back"
        },
        {
          "id": "b20",
          "kind": "process",
          "text": "return False"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
