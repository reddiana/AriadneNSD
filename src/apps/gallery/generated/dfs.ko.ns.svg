{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "ko"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "dfs_all(graph)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "visited, order = set(), []"
        },
        {
          "id": "b2",
          "kind": "for",
          "text": "for v in graph    # 떨어진 조각마다",
          "body": [
            {
              "id": "b3",
              "kind": "if",
              "text": "v not in visited",
              "yes": {
                "id": "r1",
                "body": [
                  {
                    "id": "b4",
                    "kind": "call",
                    "target": {
                      "kind": "local",
                      "diagram": "d2"
                    },
                    "args": "graph, v",
                    "result": ""
                  }
                ]
              },
              "no": {
                "id": "r2",
                "body": [
                  {
                    "id": "b5",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b6",
          "kind": "process",
          "text": "return order[::-1]    # DAG라면 위상 순서"
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "dfs(graph, u)"
      },
      "body": [
        {
          "id": "b7",
          "kind": "process",
          "text": "visited.add(u)    # 들어갈 때 (전위)"
        },
        {
          "id": "b8",
          "kind": "for",
          "text": "for v in graph[u]",
          "body": [
            {
              "id": "b9",
              "kind": "if",
              "text": "v not in visited",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b10",
                    "kind": "call",
                    "target": {
                      "kind": "local",
                      "diagram": "d2"
                    },
                    "args": "graph, v",
                    "result": ""
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b11",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            }
          ]
        },
        {
          "id": "b12",
          "kind": "process",
          "text": "order.append(u)    # 나올 때 (후위)"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
