      "head": {
        "kind": "method",
        "text": "quicksort(a, lo, hi)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "if",
          "text": "lo < hi",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b2",
                "kind": "call",
                "target": {
                  "kind": "local",
                  "diagram": "d2"
                },
                "args": "a, lo, hi",
                "result": "p"
              },
              {
                "id": "b3",
                "kind": "call",
                "target": {
                  "kind": "local",
                  "diagram": "d1"
                },
                "args": "a, lo, p - 1",
                "result": ""
              },
              {
                "id": "b4",
                "kind": "call",
                "target": {
                  "kind": "local",
                  "diagram": "d1"
                },
                "args": "a, p + 1, hi",
                "result": ""
              }
            ]
          },
          "no": {
            "id": "r2",
