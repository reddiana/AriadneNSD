              {
                "id": "b5",
                "kind": "process",
                "text": ""
              }
            ]
          }
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "partition(a, lo, hi)"
      },
      "body": [
        {
          "id": "b6",
          "kind": "process",
          "text": "pivot = a[hi];"
        },
        {
          "id": "b7",
          "kind": "process",
          "text": "i = lo - 1;"
        },
        {
          "id": "b8",
          "kind": "process",
          "text": "j = lo;"
        },
        {
          "id": "b9",
          "kind": "while",
          "text": "j < hi",
          "body": [
            {
              "id": "b10",
              "kind": "if",
              "text": "a[j] <= pivot",
              "yes": {
                "id": "r3",
                "body": [
                  {
                    "id": "b11",
                    "kind": "process",
                    "text": "i++;"
                  },
                  {
                    "id": "b12",
                    "kind": "process",
                    "text": "swap(a[i], a[j]);"
                  }
                ]
              },
              "no": {
                "id": "r4",
                "body": [
                  {
                    "id": "b13",
                    "kind": "process",
                    "text": ""
                  }
                ]
              }
            },
            {
              "id": "b14",
              "kind": "process",
              "text": "j++;"
            }
          ]
        },
        {
          "id": "b15",
          "kind": "process",
          "text": "swap(a[i + 1], a[hi]);"
        },
        {
          "id": "b16",
          "kind": "process",
          "text": "return i + 1;"
        }
      ]
    }
  ],
