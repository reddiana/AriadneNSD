          },
          "args": "240, 46",
          "result": "g"
        },
        {
          "id": "b2",
          "kind": "process",
          "text": "print(g)    # 2"
        },
        {
          "id": "b3",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d3"
          },
          "args": "240, 46",
          "result": "g, x, y"
        },
        {
          "id": "b4",
          "kind": "process",
          "text": "print(x, y)    # -9 47: 240·(-9) + 46·47 = 2"
        }
      ]
    },
    {
      "id": "d2",
      "head": {
        "kind": "method",
        "text": "gcd(a, b)"
      },
      "body": [
        {
          "id": "b5",
          "kind": "while",
          "text": "b != 0",
          "body": [
            {
              "id": "b6",
              "kind": "process",
              "text": "a, b = b, a % b    # gcd(a, b) = gcd(b, a mod b)"
            }
          ]
        },
        {
          "id": "b7",
          "kind": "process",
          "text": "return a"
        }
      ]
    },
    {
      "id": "d3",
      "head": {
        "kind": "method",
        "text": "ext_gcd(a, b)"
      },
      "body": [
        {
          "id": "b8",
          "kind": "if",
          "text": "b == 0",
          "yes": {
            "id": "r1",
            "body": [
              {
                "id": "b9",
                "kind": "exit",
                "text": "return a, 1, 0"
              }
            ]
          },
          "no": {
            "id": "r2",
            "body": [
              {
                "id": "b10",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b11",
          "kind": "call",
          "target": {
            "kind": "local",
            "diagram": "d3"
          },
          "args": "b, a % b",
          "result": "g, x, y"
        },
        {
          "id": "b12",
          "kind": "process",
          "text": "return g, y, x - (a // b) * y    # substitute back"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
