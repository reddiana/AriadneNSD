  <metadata>
    <ans:document xmlns:ans="https://github.com/reddiana/AriadneNSD" version="1" drawing-sha256="4950dfe685ca475bf72a1c9cc48cdd1d881ea677470c3699c384d5649c64a2e1"><![CDATA[
{
  "format": "ariadne-nsd",
  "version": 1,
  "settings": {
    "textKind": "plain",
    "theme": "default",
    "headStyle": "title",
    "locale": "de"
  },
  "diagrams": [
    {
      "id": "d1",
      "head": {
        "kind": "method",
        "text": "topo_sort(graph)"
      },
      "body": [
        {
          "id": "b1",
          "kind": "process",
          "text": "indeg = {v: 0 for v in graph}"
        },
        {
          "id": "b2",
          "kind": "for",
          "text": "for u in graph",
          "body": [
            {
              "id": "b3",
              "kind": "for",
              "text": "for v in graph[u]",
              "body": [
                {
                  "id": "b4",
                  "kind": "process",
                  "text": "indeg[v] += 1"
                }
              ]
            }
          ]
        },
        {
          "id": "b5",
          "kind": "process",
          "text": "q = deque(v for v in graph if indeg[v] == 0)    # Knoten ohne eingehende Kante"
        },
        {
          "id": "b6",
          "kind": "process",
          "text": "order = []"
        },
        {
          "id": "b7",
          "kind": "while",
          "text": "q",
          "body": [
            {
              "id": "b8",
              "kind": "process",
              "text": "u = q.popleft()"
            },
            {
              "id": "b9",
              "kind": "process",
              "text": "order.append(u)"
            },
            {
              "id": "b10",
              "kind": "for",
              "text": "for v in graph[u]",
              "body": [
                {
                  "id": "b11",
                  "kind": "process",
                  "text": "indeg[v] -= 1"
                },
                {
                  "id": "b12",
                  "kind": "if",
                  "text": "indeg[v] == 0",
                  "yes": {
                    "id": "r1",
                    "body": [
                      {
                        "id": "b13",
                        "kind": "process",
                        "text": "q.append(v)"
                      }
                    ]
                  },
                  "no": {
                    "id": "r2",
                    "body": [
                      {
                        "id": "b14",
                        "kind": "process",
                        "text": ""
                      }
                    ]
                  }
                }
              ]
            }
          ]
        },
        {
          "id": "b15",
          "kind": "if",
          "text": "len(order) < len(graph)",
          "yes": {
            "id": "r3",
            "body": [
              {
                "id": "b16",
                "kind": "exit",
                "text": "return None    # es gibt einen Zyklus"
              }
            ]
          },
          "no": {
            "id": "r4",
            "body": [
              {
                "id": "b17",
                "kind": "process",
                "text": ""
              }
            ]
          }
        },
        {
          "id": "b18",
          "kind": "process",
          "text": "return order"
        }
      ],
      "folds": [
        {
          "id": "f1",
          "first": "b1",
          "last": "b2",
          "name": "Eingehende Kanten zählen"
        }
      ]
    }
  ],
  "view": {
    "folded": [],
    "opened": [],
    "bands": true,
    "resultSymbol": "←"
  }
}
    ]]></ans:document>
  </metadata>
